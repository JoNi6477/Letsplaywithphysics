<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Let's Play With Physics</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo"><img src="Logo.png" alt="Let's Play With Physics"></a>
    <a href="login.html" class="nav-cta" style="display:inline-block">Log in</a>
  </nav>

  <main>
    <div class="auth-wrap">
      <div style="text-align:center; margin-bottom: 24px;">
        <h1>Set a new password</h1>
      </div>
      <div class="auth-card">
        <div class="msg" id="msg" hidden role="status"></div>
        <p class="loading" id="checking">Checking your reset link…</p>
        <form id="form-reset" novalidate hidden>
          <label class="field">New password <small>At least 8 characters.</small>
            <input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">Type it again
            <input class="input" type="password" name="confirm" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Save new password</button>
        </form>
        <div class="auth-foot" id="request-new" hidden><a href="login.html">Request a new reset link</a></div>
      </div>
    </div>
  </main>

  <footer><span>&copy; 2026 Let's Play With Physics</span></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/account.js"></script>
  <script>
    const msg = $('msg');
    const form = $('form-reset');

    // The email link signs the student in for this one purpose.
    sb.auth.getSession().then(({ data }) => {
      $('checking').hidden = true;
      if (data.session) { form.hidden = false; return; }
      showMessage(msg, 'This reset link is invalid or has expired. Please request a new one.', 'error');
      $('request-new').hidden = false;
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!form.reportValidity()) return;
      if (form.password.value !== form.confirm.value) { showMessage(msg, 'The two passwords do not match.', 'error'); return; }
      const btn = form.querySelector('button');
      btn.disabled = true;
      const { error } = await sb.auth.updateUser({ password: form.password.value });
      btn.disabled = false;
      if (error) { showMessage(msg, friendlyError(error), 'error'); return; }
      form.hidden = true;
      showMessage(msg, 'Password updated! Taking you to your dashboard…', 'success');
      setTimeout(() => location.replace('dashboard.html'), 1500);
    });
  </script>
</body>
</html>
